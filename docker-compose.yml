# ==============================================================================
# DOCKER COMPOSE - RESTAURANTE RYU (SISTEMA DE TELEFONÍA, KAG Y GRAFOS POSTGRESQL)
# ==============================================================================

services:
  # Base de Datos de Grafos (PostgreSQL + Apache AGE para KAG y Ontología de Restaurante)
  ryu-postgres-age:
    image: apache/age:latest
    container_name: ryu-postgres-age
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ryu_db}
      - POSTGRES_USER=${POSTGRES_USER:-ryu_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ryu_secret_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ryu_postgres_data:/var/lib/postgresql
      - ./db/init_age.sql:/docker-entrypoint-initdb.d/01-init-age.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ryu_admin} -d ${POSTGRES_DB:-ryu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Servicio Telefónico Principal (SIP Zadarma + Faster-Whisper + Edge-TTS + GPT-4o-mini + KAG + Protobuf)
  ryu-telephony:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryu-telephony-service
    restart: unless-stopped
    depends_on:
      ryu-postgres-age:
        condition: service_healthy
    env_file:
      - .env
    network_mode: host

    volumes:
      - ./menu_ryu.json:/app/menu_ryu.json:ro
      - ./prompt_voice_telephone_ryu.md:/app/prompt_voice_telephone_ryu.md:ro
      - ./knowledge_base_ryu.md:/app/knowledge_base_ryu.md:ro
      - ./logs:/app/logs

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Mexico_City
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5433}

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  ryu_postgres_data:
    name: ryu_postgres_data
