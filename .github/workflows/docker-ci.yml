name: CI - Ryu AI Telephony & Docker Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-validation:
    name: Validar Código y Menú
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar Sintaxis de Archivos Python
        run: |
          python -m py_compile sip_telephony_service.py voice_engine_ryu.py order_service.py

      - name: Validar Integridad de Catálogo JSON (menu_ryu.json)
        run: |
          python -c "import json; data = json.load(open('menu_ryu.json', encoding='utf-8')); assert 'restaurant' in data and 'menu' in data; print('menu_ryu.json es 100% válido.')"

  docker-build:
    name: Validar Construcción de Imagen Docker
    runs-on: ubuntu-latest
    needs: python-validation
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Imagen Docker (Sin Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ryu-telephony:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue Automático a Oracle Cloud VPS
    runs-on: ubuntu-latest
    needs: [python-validation, docker-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Arath-changes') && github.event_name == 'push'
    steps:
      - name: Desplegar en Servidor Oracle Cloud vía SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.HAS_SSH_KEY == 'true'
        env:
          HAS_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY != '' }}
        with:
          host: ${{ secrets.ORACLE_HOST || '140.84.186.64' }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "--- Sincronizando repositorio en VPS ---"
            cd /home/ubuntu/ryu-ai-telephony
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            echo "--- Recreando contenedor ryu-telephony ---"
            docker compose up -d --force-recreate ryu-telephony
            sleep 8
            echo "--- Estado del servicio ---"
            docker logs --tail 20 ryu-telephony-service

